[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "venv-match"
version = "0.2.1"
description = "Compare Python runtime environments and investigate environment drift"
authors = ["Ishaan Tidke <ishaantidke25@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/IT2411/venv-match"
repository = "https://github.com/IT2411/venv-match"
documentation = "https://github.com/IT2411/venv-match#readme"
keywords = ["python", "virtualenv", "venv", "environment", "comparison", "diagnostics", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
packages = [{ include = "venv_match", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.9.0"
mypy = "^1.10.0"
twine = ">=6.1.0"
packaging = ">=24.2"

[tool.poetry.scripts]
venv-match = "venv_match.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
